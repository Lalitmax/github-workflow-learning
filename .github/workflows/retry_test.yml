name: Test retry-cmd

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -eux {0}
jobs:
  retry-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Install retry-cli
        run: cargo install retry-cli --version 0.0.5
      - name: Verify installation
        run: retry --version

      # Test 1: retry with a simple failing command
      - name: Test 1 - Retry direct command
        shell: bash
        run: retry --attempts 3 --min-duration 3s -- git ls
