name: Test retry-cmd

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -eux {0}
jobs:
  retry-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Install retry-cmd
        run: cargo install retry-cmd

      - name: Verify installation
        run: |
          retry --max 3 --interval 5 -- bash -eux -c '
            retry --version
          '

      # Test 1: retry with a simple failing command
      - name: Test 1 - Retry direct command
        shell: bash
        run: retry --max 3 --interval 5 -- git status
